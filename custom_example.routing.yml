# My Dashboard
custom_example.dashboard_permission:
  path: '/my-dashboard'
  defaults:
    _form: '\Drupal\custom_example\Form\DashboardPermission'
    _title: 'My Dashboard'
  requirements:
    _permission: 'access content'

# Create play logs for video and audio
custom_example.player_logs:
  path: '/analytics/archive/log'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::archive_play_log'
    _title: 'Player log'
  requirements:
    _permission: 'access content'

# Dashboard summary
custom_example.dashboard_summary:
  path: '/dashboard/summary'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::dashboardSummary'
    _title: 'Dashboard summary'
  requirements:
    _role: 'administrator'

custom_example.dashboard_summary_generate:
  path: '/admin/dashboard/summary/generate'
  defaults:
    _form: '\Drupal\custom_example\Form\GenerateDashboardSummaryForm'
    _title: 'Generate Dashboard Summary'
  requirements:
    _role: 'administrator'

custom_example.mediaelement_log:
  path: '/media-tracking/log'
  defaults:
    _controller: '\Drupal\custom_example\Controller\MediaElementLogController::track'
  requirements:
    _permission: 'access content'
