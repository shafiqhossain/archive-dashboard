# Settings
custom_example.settings:
  path: '/admin/config/user-interface/analytics-settings'
  defaults:
    _form: '\Drupal\custom_example\Form\AnalyticsSettings'
    _title: 'Analytics Settings'
  requirements:
    _permission: 'access administration pages'

custom_example.custom_example:
  path: '/analytics/dashboard'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsSimpleDashboardController::analyticsDashboard'
    _title: 'Analytics Dashboard'
  requirements:
    _permission: 'access analytics dashboard'

custom_example.analytics_host_dashboard:
  path: '/analytics/host/dashboard'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsSimpleDashboardController::analyticsHostDashboard'
    _title: 'Analytics Dashboard'
  requirements:
    _permission: 'access analytics host dashboard'

custom_example.dashboard_column_settings:
  path: '/analytics/dashboard/columns'
  defaults:
    _form: '\Drupal\custom_example\Form\DashboardColumns'
    _title: 'Dashboard Column Settings'
  requirements:
    _permission: 'access analytics dashboard columns'


custom_example.host_dashboard:
  path: '/host-dashboard/user'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AdminDashboardController::custom_example_redirect_path'
    _title: 'Analytics Dashboard'
  requirements:
    _permission: 'access content'

custom_example.shows_link:
  path: '/shows/link/ajax/{nid}/{linkClick}/{showNameVal}'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AdminDashboardController::ajax_menu_links'
    _title: 'Analytics Dashboard'
  requirements:
    _permission: 'access administration pages'

custom_example.show_autocomplete:
  path: '/showname/autocomplete/{string}'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AdminDashboardController::dashboard_showname_autocomplete'
    _title: 'Analytics Dashboard'
  requirements:
    _permission: 'access administration pages'

custom_example.host_autocomplete:
  path: '/host/showname/autocomplete/{string}'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AdminDashboardController::dashboard_host_showname_autocomplete'
    _title: 'Analytics Dashboard'
  requirements:
    _permission: 'access administration pages'

custom_example.more_data_stats:
  path: '/dashboard/more-data-stats'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::dashboard_more_data_stats_page'
    _title: 'Analytics Dashboard'
  requirements:
    _role: 'administrator+host+old_host'

custom_example.live_listener_stats:
  path: '/dashboard/live-listener-stats'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::dashboard_live_listener_stats_page'
    _title: 'Analytics Dashboard'
  requirements:
    _role: 'administrator+host+old_host'

