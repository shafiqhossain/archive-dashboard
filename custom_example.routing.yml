custom_example.article_seperate:
  path: '/dashboard/article/separate'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::dashboard_article_separate_page'
    _title: 'Analytics Dashboard'
  requirements:
    _role: 'administrator+host+old_host'

custom_example.upcomeshow_seperate:
  path: '/dashboard/upcomeshow/separate'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::dashboard_upcoming_show_separate_page'
    _title: 'Analytics Dashboard'
  requirements:
