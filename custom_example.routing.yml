custom_example.episode_seperate:
  path: '/dashboard/episode/separate'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::dashboard_episode_separate_page'
    _title: 'Analytics Dashboard'
  requirements:
    _role: 'administrator+host+old_host'

custom_example.export:
  path: '/dashboard/export'
  defaults:
    _controller: '\Drupal\custom_example\Controller\AnalyticsDashboardController::dashboard_export'
    _title: 'Analytics Dashboard'
  requirements:
